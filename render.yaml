# Render Blueprint — click-deploy worker + Evolution (all free plan).
# Usage: Render Dashboard → New → Blueprint → select this repo (render.yaml at root).
# Then fill every `sync: false` variable in the dashboard (never commit secrets).
# Region tip: pick Singapore to sit next to TiDB ap-southeast-1 + Upstash.
services:
  # BullMQ worker (generation + sending). Runs as a Web Service (not Background
  # Worker) so the free instance can be kept awake by a 10-min cron ping to /health.
  - type: web
    name: wa-outreach-worker
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run worker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
        description: TiDB MySQL URL with ?sslaccept=strict (same value as Vercel)
      - key: REDIS_URL
        sync: false
        description: Upstash native Redis TLS endpoint rediss://... (NOT REST URL)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EVOLUTION_API_URL
        sync: false
        description: Paste Render Evolution URL after wa-evolution deploys, then redeploy worker
      - key: EVOLUTION_API_KEY
        sync: false
        description: Must equal wa-evolution AUTHENTICATION_API_KEY
      - key: EVOLUTION_INSTANCE
        value: business-01
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://whatsapp-outreach-automation.vercel.app
      - key: NEXTAUTH_SECRET
        sync: false
        description: Same value as Vercel
      - key: APP_URL
        value: https://whatsapp-outreach-automation.vercel.app

  # WhatsApp gateway. Free plan has NO persistent disk: after a sleep/restart
  # you must re-scan the QR (WhatsApp → Connect). The 10-min cron ping to
  # /manager (or instance status) reduces how often this happens.
  - type: web
    name: wa-evolution
    runtime: image
    plan: free
    region: singapore
    image:
      url: evoapicloud/evolution-api:v2.3.7
    envVars:
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: 8080
      - key: AUTHENTICATION_API_KEY
        sync: false
        description: Generate random 40+ chars; paste SAME value into Vercel + worker as EVOLUTION_API_KEY
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
        description: Neon free Postgres connection string (Evolution's own DB, separate from TiDB)
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "false"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "false"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URI
        sync: false
        description: Same Upstash rediss:// URL as REDIS_URL
      - key: REDIS_PREFIX_KEY
        value: evolution
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        sync: false
        description: Same Upstash rediss:// URL as REDIS_URL
      - key: CACHE_REDIS_PREFIX_KEY
        value: evolution
      - key: CACHE_REDIS_SAVE_INSTANCES
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "false"
      - key: RABBITMQ_ENABLED
        value: "false"
      - key: WEBSOCKET_ENABLED
        value: "false"
      - key: QRCODE_LIMIT
        value: 30
      - key: WEBHOOK_GLOBAL_URL
        value: https://whatsapp-outreach-automation.vercel.app/api/webhooks/evolution
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "true"
      - key: WEBHOOK_EVENTS_MESSAGES_UPDATE
        value: "true"
      - key: WEBHOOK_EVENTS_MESSAGES_UPSERT
        value: "true"
      - key: WEBHOOK_EVENTS_CONNECTION_UPDATE
        value: "true"
